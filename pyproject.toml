[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "har-mcu"
version = "0.1.0"
description = "Reproducible WISDM HAR pipeline with TensorFlow 2.14.1 CUDA and TFLite Micro deployment"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
authors = [
  { name = "har-mcu contributors" }
]
dependencies = [
  "numpy==1.24.3",
  "pandas==2.1.4",
  "scipy==1.11.4",
  "scikit-learn==1.3.2",
  "matplotlib==3.8.2",
  "seaborn==0.13.2",
  "PyYAML==6.0.1",
  "tqdm==4.66.5",
  "flatbuffers==23.5.26",
  "tensorflow[and-cuda]==2.14.1",
  "tensorflow-model-optimization==0.8.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
