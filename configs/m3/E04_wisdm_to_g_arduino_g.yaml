base_config: configs/default.yaml
paths:
  raw_csv: WISDM_ar_v1.1/WISDM_ar_v1.1_raw.csv
  wisdm_raw_csv: WISDM_ar_v1.1/WISDM_ar_v1.1_raw.csv
  arduino_raw_csv: tiny-motion/Arduino_layth_hamza_wisdm_raw_numeric_user.csv
  processed_dir: data/processed/m3/E04_wisdm_to_g_arduino_g
  checkpoints_dir: checkpoints/m3/E04_wisdm_to_g_arduino_g
  reports_dir: reports/m3
  models_tflite_dir: models_tflite/m3/E04_wisdm_to_g_arduino_g
  deploy_common_dir: deploy/common/m3/E04_wisdm_to_g_arduino_g
m3:
  experiment_id: E04_wisdm_to_g_arduino_g
  transfer_mode: zero_shot
  diagnostic_only: false
data:
  source: wisdm_arduino
  train_domain: wisdm
  eval_domain: arduino
  sample_rate_hz: 20
  target_sample_rate_hz: 20
  downsample: false
  window_duration_seconds: 5.0
  unit_mode: wisdm_to_g
  domain_unit_modes:
    wisdm: wisdm_to_g
    arduino: arduino_g
  unit_scales:
    wisdm:
      pre_multiply: 1.0
      scale: 0.10197162129779283
      divisor: 9.80665
    arduino:
      pre_multiply: 4.0
      scale: 1.0
normalization:
  mode: train_zscore
  diagnostic_skip_inference_norm: false
augment:
  accel_rotation:
    enabled: true
    probability: 0.5
    apply_in_qat: true
    mode: uniform_so3
window_size_default: 100
window_sizes_sweep:
- 100
overlap: 0.5
split_protocols:
- random_stratified
paper_protocol:
  original_window: 100
  wisdm_window_override: 100
experiment:
  paper_slug: m3
  model_variant: deepconv_lstm_conv2d
  run_id: E04_deepconv_lstm_r0
  compression_focus: ptq_qat_only
  model_kwargs: {}
  paper_targets:
    fp32_accuracy: null
    ptq_accuracy: null
    qat_accuracy: null
    notes: Convert WISDM to g and undo Arduino firmware divide-by-four only.
