base_config: configs/default.yaml
paths:
  raw_csv: WISDM_ar_v1.1/WISDM_ar_v1.1_raw.csv
  wisdm_raw_csv: WISDM_ar_v1.1/WISDM_ar_v1.1_raw.csv
  arduino_raw_csv: tiny-motion/Arduino_layth_hamza_wisdm_raw_numeric_user.csv
  processed_dir: data/processed/m3/E11_wisdm_pretrain_arduino_finetune_T50
  checkpoints_dir: checkpoints/m3/E11_wisdm_pretrain_arduino_finetune_T50
  reports_dir: reports/m3
  models_tflite_dir: models_tflite/m3/E11_wisdm_pretrain_arduino_finetune_T50
  deploy_common_dir: deploy/common/m3/E11_wisdm_pretrain_arduino_finetune_T50
m3:
  experiment_id: E11_wisdm_pretrain_arduino_finetune_T50
  transfer_mode: finetune
  diagnostic_only: false
  pretrain_experiment_id: E00_wisdm_m2_anchor
data:
  source: wisdm_arduino
  train_domain: arduino
  pretrain_domain: wisdm
  eval_domain: arduino
  sample_rate_hz: 20
  target_sample_rate_hz: 20
  downsample: false
  window_duration_seconds: 2.5
  unit_mode: raw_no_conversion
  domain_unit_modes:
    wisdm: raw_no_conversion
    arduino: raw_no_conversion
  unit_scales:
    wisdm:
      pre_multiply: 1.0
      scale: 1.0
    arduino:
      pre_multiply: 1.0
      scale: 1.0
normalization:
  mode: train_zscore
  diagnostic_skip_inference_norm: false
window_size_default: 50
window_sizes_sweep:
- 50
overlap: 0.5
split_protocols:
- random_stratified
paper_protocol:
  original_window: 50
  wisdm_window_override: 50
experiment:
  paper_slug: m3
  model_variant: deepconv_lstm_conv2d
  run_id: E11_deepconv_lstm_r0
  compression_focus: ptq_qat_only
  model_kwargs: {}
  paper_targets:
    fp32_accuracy: null
    ptq_accuracy: null
    qat_accuracy: null
    notes: >-
      Same protocol as E09 (WISDM pretrain then Arduino fine-tune, train_zscore, eval Arduino test)
      but T=50 (2.5 s @ 20 Hz). Compare to E09 (T=100) for window-length apples-to-apples.
