paths:
  raw_csv: /home/dellio/github/har-mcu/WISDM_ar_v1.1/WISDM_ar_v1.1_raw.csv
  processed_dir: /home/dellio/github/har-mcu/data/processed
  checkpoints_dir: /home/dellio/github/har-mcu/checkpoints
  reports_dir: /home/dellio/github/har-mcu/reports
  models_tflite_dir: /home/dellio/github/har-mcu/models_tflite
  deploy_common_dir: /home/dellio/github/har-mcu/deploy/common
env:
  tensorflow_version: 2.14.1
  require_gpu: false
runtime:
  run_mode: sanity_check
  gpu_fallback_to_cpu: true
  fail_if_gpu_missing: false
  stage_devices:
    sanity_check:
      train: gpu
      eval_fp32: gpu
      ptq: gpu
      eval_ptq: gpu
      qat: cpu
      eval_qat: cpu
    full_run:
      train: cpu
      eval_fp32: cpu
      ptq: cpu
      eval_ptq: cpu
      qat: cpu
      eval_qat: cpu
seed: 42
classes:
- Walking
- Jogging
- Upstairs
- Downstairs
- Sitting
- Standing
window_size_default: 20
window_sizes_sweep:
- 20
overlap: 0.5
test_ratio: 0.33
val_ratio_from_train: 0.2
split_protocols:
- random_stratified
- user_holdout
label_policy: drop_cross_boundary
experiment:
  paper_slug: deepconvlstm
  model_variant: deepconv_lstm
  run_id: smoke
  compression_focus: ptq_qat_only
  paper_targets:
    fp32_accuracy: null
    ptq_accuracy: null
    qat_accuracy: null
    notes: Smoke config is for pipeline sanity, not paper target matching.
  model_kwargs: {}
paper_protocol:
  original_window: 20
  wisdm_window_override: 20
train:
  learning_rate: 0.001
  batch_size: 64
  epochs: 1
  dropout: 0.3
  reduce_lr_factor: 0.5
  reduce_lr_patience: 2
  early_stopping_patience: 3
quant:
  ptq:
    representative_samples: 32
    representative_source: train
    enforce_full_int8: true
    strict_full_int8: true
    require_tflm_compatible: true
    accepted_integer_io_dtypes:
    - int8
    - uint8
  qat:
    enabled: true
    annotation_policy: auto
    learning_rate: 0.0001
    epochs: 1
    batch_size: 64
    representative_samples: 32
    representative_source: train
    enforce_full_int8: true
    strict_full_int8: true
    require_tflm_compatible: true
    accepted_integer_io_dtypes:
    - int8
    - uint8
eval:
  tflite_timing:
    enabled: true
    warmup_samples: 8
    timed_samples: 32
deploy:
  tflm_commit: 5f9d9d6
  board_fqbn: arduino:mbed_nano:nano33ble
  tensor_arena_kb: 64
  sample_rate_hz: 20
  enable_power_measurement: false
smoke:
  enabled: true
  max_windows_per_class: 200
  representative_samples: 32
  quick_epochs: 1
