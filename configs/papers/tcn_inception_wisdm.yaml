paths:
  raw_csv: WISDM_ar_v1.1/WISDM_ar_v1.1_raw.csv
  processed_dir: data/processed
  checkpoints_dir: checkpoints
  reports_dir: reports
  models_tflite_dir: models_tflite
  deploy_common_dir: deploy/common
env:
  tensorflow_version: 2.14.1
  require_gpu: false
runtime:
  run_mode: sanity_check
  gpu_fallback_to_cpu: true
  fail_if_gpu_missing: false
  stage_devices:
    sanity_check:
      train: gpu
      eval_fp32: gpu
      ptq: gpu
      eval_ptq: gpu
      qat: gpu
      eval_qat: gpu
    full_run:
      train: gpu
      eval_fp32: gpu
      ptq: gpu
      eval_ptq: gpu
      qat: gpu
      eval_qat: gpu
seed: 42
classes:
- Walking
- Jogging
- Upstairs
- Downstairs
- Sitting
- Standing
window_size_default: 200
window_sizes_sweep:
- 200
overlap: 0.5
test_ratio: 0.33
val_ratio_from_train: 0.2
split_protocols:
- random_stratified
- user_holdout
label_policy: drop_cross_boundary
experiment:
  paper_slug: tcn_inception
  model_variant: tcn_inception_conv2d
  run_id: wisdm_r0
  compression_focus: ptq_qat_only
  paper_targets:
    fp32_accuracy: null
    ptq_accuracy: null
    qat_accuracy: null
    notes: Paper targets are on other datasets; WISDM entries are adaptation results.
  model_kwargs:
    max_kernel_size: 68
    bottleneck_size: 32
    inception_depth: 5
    inception_filters: 16
    tcn_filters: 16
    tcn_kernel_size: 3
    dilations:
    - 1
    - 2
    - 4
    - 8
    use_bottleneck: true
    use_residual: true
    dropout: 0.2
paper_protocol:
  original_window: 128
  wisdm_window_override: 200
train:
  learning_rate: 0.0005
  batch_size: 64
  epochs: 300
  dropout: 0.2
  reduce_lr_factor: 0.5
  reduce_lr_patience: 8
  early_stopping_patience: 12
quant:
  ptq:
    representative_samples: 128
    representative_source: train
    enforce_full_int8: true
    strict_full_int8: true
    require_tflm_compatible: true
    accepted_integer_io_dtypes:
    - int8
    - uint8
  qat:
    enabled: true
    annotation_policy: all_supported
    device_preference: gpu
    auto_fallback_to_cpu: true
    learning_rate: 0.0001
    epochs: 12
    batch_size: 64
    representative_samples: 128
    representative_source: train
    enforce_full_int8: true
    strict_full_int8: true
    require_tflm_compatible: true
    accepted_integer_io_dtypes:
    - int8
    - uint8
eval:
  tflite_timing:
    enabled: true
    warmup_samples: 32
    timed_samples: 256
deploy:
  allowed_ops_profile: nano33ble_extended
  allowed_ops: null
  tflm_commit: 5f9d9d6
  board_fqbn: arduino:mbed_nano:nano33ble
  tensor_arena_kb: 64
  sample_rate_hz: 20
  enable_power_measurement: false
smoke:
  enabled: false
  max_windows_per_class: null
  representative_samples: 64
  quick_epochs: 1
