paths:
  raw_csv: WISDM_ar_v1.1/WISDM_ar_v1.1_raw.csv
  processed_dir: data/processed
  checkpoints_dir: checkpoints
  reports_dir: reports
  models_tflite_dir: models_tflite
  deploy_common_dir: deploy/common

env:
  tensorflow_version: 2.14.1
  require_gpu: false

seed: 42
classes: [Walking, Jogging, Upstairs, Downstairs, Sitting, Standing]
window_size_default: 200
window_sizes_sweep: [200]
overlap: 0.5
test_ratio: 0.33
val_ratio_from_train: 0.2
split_protocols: [random_stratified, user_holdout]
label_policy: drop_cross_boundary

experiment:
  paper_slug: repmobile
  model_variant: repmobile_folded
  run_id: wisdm_r0
  model_kwargs:
    channels: [32, 64, 96, 128]
    stride: 1
    dropout: 0.1

paper_protocol:
  original_window: 200
  wisdm_window_override: 200

train:
  learning_rate: 0.0001
  batch_size: 128
  epochs: 40
  dropout: 0.1
  reduce_lr_factor: 0.5
  reduce_lr_patience: 6
  early_stopping_patience: 8

quant:
  ptq:
    representative_samples: 128
    representative_source: train
    enforce_full_int8: true
    strict_full_int8: true
    require_tflm_compatible: true
    accepted_integer_io_dtypes: [int8, uint8]
  qat:
    enabled: true
    annotation_policy: all_supported
    learning_rate: 0.0001
    epochs: 8
    batch_size: 128
    representative_samples: 128
    representative_source: train
    enforce_full_int8: true
    strict_full_int8: true
    require_tflm_compatible: true
    accepted_integer_io_dtypes: [int8, uint8]

deploy:
  tflm_commit: 5f9d9d6
  board_fqbn: arduino:mbed_nano:nano33ble
  tensor_arena_kb: 64
  sample_rate_hz: 20
  enable_power_measurement: false

smoke:
  enabled: false
  max_windows_per_class: null
  representative_samples: 64
  quick_epochs: 1
